name: Keepalive

# GitHub disables scheduled workflows in a public repository after 60 days
# with no repository activity. Nobody commits to a fantasy league mid-season,
# so without this the FPL sync would quietly stop somewhere around November
# and scores would freeze with no error anywhere.
#
# One commit a month is enough to keep the clock reset.

on:
  schedule:
    - cron: '23 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Touch heartbeat
        run: |
          mkdir -p .github
          date -u +"Last keepalive: %Y-%m-%dT%H:%M:%SZ" > .github/HEARTBEAT
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/HEARTBEAT
          git diff --staged --quiet || git commit -m "chore: keepalive so the FPL sync schedule stays enabled"
          git push
