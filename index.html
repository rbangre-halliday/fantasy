<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08070A" />
    <meta name="description" content="A private Fantasy Premier League draft for you and five friends." />
    <title>The Draft — Fantasy Premier League</title>

    <!--
      Archivo is self-hosted rather than pulled from Google Fonts: the width
      axis is the whole typographic idea here, and a third-party stylesheet
      that render-blocks — and can be slow, blocked or subset differently —
      is not something to hang the design's voice on. Two files, same origin,
      preloaded, no DNS round trip before the first paint.
    -->
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />

    <link rel="preload" href="/fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
